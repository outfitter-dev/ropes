# Cinch's own configuration for this repository.
# The pilot format is unstable and will change without notice.
pilot = 0

include = ["**/*.md", "**/*.toml"]
exclude = ["packages/cinch/tests/fixtures/**"]

[markdown]
enabled = true

[toml]
enabled = true

# The facts editors and formatters have to agree on. Cinch writes
# `.editorconfig` from this table.
[editor]
charset = "utf-8"
indent_style = "space"
indent_size = 2
end_of_line = "lf"
final_newline = true
trim_trailing_whitespace = true

# Two trailing spaces are a line break in Markdown.
[[editor.overrides]]
files = ["*.md"]
trim_trailing_whitespace = false

# The shared lint, formatter and TypeScript configs. The root configs extend
# the copies Cinch keeps under `.outfitter/configs/presets/`.
[lint]
preset = true

[format]
preset = true

[typescript]
preset = true
