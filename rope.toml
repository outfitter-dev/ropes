# Ropes configuration for this repository.
# The pilot format is unstable and will change without notice.
pilot = 0

include = [
  "**/*.md",
  "**/*.toml",
  "**/*.ts",
  "**/*.json",
  "**/*.yml",
  "**/*.yaml",
]

[markdown]
enabled = true
links = true

[toml]
enabled = true

[install]
isolated = true
minimum_release_age = "7 days"

# The facts editors and formatters have to agree on. Cinch writes
# `.editorconfig` from this table.
[editor]
charset = "utf-8"
indent_style = "space"
indent_size = 2
end_of_line = "lf"
final_newline = true
trim_trailing_whitespace = true

# Two trailing spaces are a line break in Markdown.
[[editor.overrides]]
files = ["*.md"]
trim_trailing_whitespace = false

# The shared lint, formatter and TypeScript configs. The root configs extend
# the copies Ropes keeps under `.ropes/configs/presets/`.
[lint]
enabled = true
preset = true

[format]
enabled = true
preset = true

[typescript]
enabled = true
preset = true

# The structural rules Cinch ships, run through ast-grep.
[rules]
enabled = true
packs = ["config"]

# The compiler options Cinch ships are the base, so they extend nothing.
[[overrides]]
paths = ["packages/core/presets/tsconfig.json"]

[overrides.rules]
enabled = false
