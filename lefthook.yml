# Git hooks for plain-Git use of this repository.
#
# jj does not run Git hooks. In a jj workspace, run `bun run check` before
# pushing. `climb commit` runs the same command through climb.yaml.
#
# Every command sets GIT_PAGER=cat. lefthook runs hooks in a PTY, and a
# configured Git pager makes pager-triggering Git commands hang. Hook-level env
# does not reach command children, so it is set per command.

pre-commit:
  commands:
    # Lints, type checks and formats what is staged, through the same plan
    # `bun run check` uses. It fixes what the plan allows, stages the result,
    # and stops the commit when a finding is left or an engine could not run.
    # It writes no file Ropes keeps: when the setup needs repair it stops and
    # says to run `rope doctor --fix`.
    rope:
      glob: "*.{ts,json,md,yml,yaml,toml}"
      run: bun run rope fix {staged_files}
      stage_fixed: true
      env:
        GIT_PAGER: cat

pre-push:
  commands:
    check:
      run: bun run check
      env:
        GIT_PAGER: cat
