# The one place tool versions are pinned. Local runs, CI and Cinch read this file.
# After changing a version, run `mise lock` to refresh mise.lock, then `bun run check`.
# See docs/tool-versions.md.
[tools]
actionlint = "1.7.12"
pinact = "5.0.2"
zizmor = "1.32.0"
"ast-grep" = "0.51.3"
bun = "1.4.4"
lychee = { version = "0.24.2", version_prefix = "lychee-v", libc = "musl" }
rumdl = "0.3.5"
taplo = "0.10.0"
editorconfig-checker = "4.0.2"

# Static Linux builds preserve the existing glibc floor. Keep the public pin name.
[tool_alias]
lychee = "github:lycheeverse/lychee"
