name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # mise.toml pins Bun and the external tools; mise.lock pins their checksums.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Run the cinch command from the workspace
        run: bun run cinch --version
      - name: Confirm the pinned external tools resolve
        run: rumdl --version
