name: npm release
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare the candidate or publish the verified pair
        type: choice
        required: true
        options: [prepare, publish]
      artifact_id:
        description: Verified candidate artifact ID
        type: string
      core_sha256:
        description: SHA-256 from the candidate summary for core.tgz
        type: string
      cli_sha256:
        description: SHA-256 from the candidate summary for cli.tgz
        type: string
permissions: {}
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify and retain the tarballs
        run: |
          ROPES_PACKED_OUTPUT="$RUNNER_TEMP/ropes-candidate" bun run check:packed
          cd "$RUNNER_TEMP/ropes-candidate"
          sha256sum core.tgz cli.tgz > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ropes-npm-candidate
          path: ${{ runner.temp }}/ropes-candidate/
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Verify the candidate pair
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          CORE_SHA256: ${{ inputs.core_sha256 }}
          CLI_SHA256: ${{ inputs.cli_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ || ! "$CORE_SHA256" =~ ^[0-9a-f]{64}$ || ! "$CLI_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Publishing requires an artifact ID and both lowercase SHA-256 values."
            exit 1
          fi
          artifact="repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          run_id=$(gh api "$artifact" | jq -er '
            select(.name == "ropes-npm-candidate" and .expired == false) | .workflow_run.id
          ')
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/npm-release.yml" | jq -er '.id')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" | jq -e --argjson workflow_id "$workflow_id" '
            .workflow_id == $workflow_id and .event == "workflow_dispatch" and
            .head_branch == "main" and .conclusion == "success"
          ' > /dev/null
          gh api "$artifact/zip" > "$RUNNER_TEMP/ropes-candidate.zip"
          cd "$RUNNER_TEMP"
          unzip -jo ropes-candidate.zip core.tgz cli.tgz
          printf '%s  core.tgz\n%s  cli.tgz\n' "$CORE_SHA256" "$CLI_SHA256" | sha256sum -c -

          coordinates() {
            tar -xOf "$1.tgz" package/package.json | jq -er --arg package "@ropes/$1" '
              "\\A(0|[1-9][0-9]*)([.](0|[1-9][0-9]*)){2}" as $version |
              select(.name == $package and .license == "MIT" and .publishConfig.access == "public") |
              select($package != "@ropes/cli" or .dependencies["@ropes/core"] == .version) |
              select(
                (.publishConfig.tag == "canary" and (.version | test($version + "-canary[.](0|[1-9][0-9]*)\\z"))) or
                (.publishConfig.tag == "latest" and (.version | test($version + "\\z")))
              ) |
              [.version, .publishConfig.tag] | @tsv
            '
          }

          core=$(coordinates core)
          cli=$(coordinates cli)
          if [[ "$core" != "$cli" ]]; then
            echo "Core and CLI must have the same release version and tag."
            exit 1
          fi
          IFS=$'\t' read -r version tag <<< "$core"
          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Publish core, then CLI
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          DIST_TAG: ${{ steps.candidate.outputs.tag }}
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          registry=https://registry.npmjs.org

          registry_state() {
            curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
              "$registry/@ropes%2F$1?fresh=$(date +%s)"
          }

          verify_published() {
            local package=$1 metadata pending="registry metadata"
            local deadline=$(($(date +%s) + 900))
            local archive_url="$registry/@ropes/$package/-/$package-$VERSION.tgz"
            echo "Waiting up to 15 minutes for @ropes/$package@$VERSION at $DIST_TAG."
            while (( $(date +%s) < deadline )); do
              pending="registry metadata"
              if metadata=$(registry_state "$package"); then
                pending="version metadata"
                if jq -e --arg version "$VERSION" --arg url "$archive_url" '
                  .versions[$version].dist.tarball == $url
                ' <<< "$metadata" > /dev/null; then
                  pending="dist-tag"
                  if jq -e --arg version "$VERSION" --arg tag "$DIST_TAG" '
                    .["dist-tags"][$tag] == $version
                  ' <<< "$metadata" > /dev/null; then
                    pending="public tarball"
                    if curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
                      "$archive_url?fresh=$(date +%s)" -o "$package.published.tgz"; then
                      if ! cmp "$package.tgz" "$package.published.tgz"; then
                        echo "Public @ropes/$package@$VERSION differs from the approved candidate."
                        return 1
                      fi
                      return
                    fi
                  fi
                fi
              fi
              sleep 6
            done
            echo "Timed out waiting for $pending for @ropes/$package@$VERSION at $DIST_TAG."
            echo "Rerun publish with the same artifact ID and SHA-256 inputs to verify the existing version."
            return 1
          }

          for package in core cli; do
            metadata=$(registry_state "$package")
            existing=$(jq -er --arg name "@ropes/$package" --arg version "$VERSION" '
              select(.name == $name and (.versions | type == "object")) |
              (.versions | has($version)) | tostring
            ' <<< "$metadata")
            if [[ "$existing" == false ]]; then
              npm publish "$package.tgz" --access public --tag "$DIST_TAG" --ignore-scripts --registry "$registry"
            fi
            verify_published "$package"
            printf 'Verified @ropes/%s@%s under npm tag %s.\n' "$package" "$VERSION" "$DIST_TAG" >> "$GITHUB_STEP_SUMMARY"
          done
