# How `bun install` behaves in this repository. Tool versions live in
# mise.toml and quality policy in cinch.toml: neither can change an install.
[install]
# Isolated installs: a package sees only the dependencies it declares.
linker = "isolated"
# Wait seven days (in seconds) before a new release can be resolved. A
# release that is pulled for malware is usually pulled well inside that.
# To take one sooner, name the package in `minimumReleaseAgeExcludes`.
minimumReleaseAge = 604800
